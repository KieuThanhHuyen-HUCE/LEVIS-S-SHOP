<body>
    <div id="header"></div>
    <div class="levis">
        <div id="content">
            <div class="PageLearnMore">
                <div class="banner-media">
                    <picture>
                        <source media="(min-width:1023.98px)"
                            srcset="//levi.co.th/cdn/shop/files/24_H2_LIL_LOYALTY_SIGN_UP_PAGE_HEADER_IMAGE_DSKTP.webp?v=1727941631">
                        <img src="//levi.co.th/cdn/shop/files/24_H2_LIL_LOYALTY_SIGN_UP_PAGE_HEADER_IMAGE_MBL.webp?v=1727941632&amp;width=640"

                    </picture>
                </div>
                <div class="PageLearnMore-content">

                </div>
                <div class="LearnMore-title">
                    <h1>BE THE FIRST TO KNOW</h1>
                    <p>Sign up for the Levi's® Red Tab™ Member Program and stay up to date as our story unfolds.</p>
                </div>
                <div class="user-signup__form">
                    <!-- trang đăng nhập gồm user-signup có sdt mail-->
                    <div class="user-signup__group user-signup-in-LearnMorePage">
                        <input type="text" class="user-signup__input" placeholder="Mobile Number / Email*" />
                    </div>
                    <!-- phần nút đăng kí đăng nhập, return -->
                    <div class="user-signup__controls">
                        <button class="btn btn--primary btn-disabled">CONTINUE</button>
                    </div>
                </div>
                <div class="banner-media" style="display: none;">
                    <picture>
                        <source media="(min-width:1023.98px)"

                        <img src="//levi.co.th/cdn/shop/files/24_H2_LIL_LOYALTY_SIGN_UP_PAGE_FOOTER_IMAGE_MBL.webp?v=1727941631&amp;width=640"

                    </picture>

        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // JavaScript để load header
        document.addEventListener("DOMContentLoaded", function () {
            fetch("header.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("header").innerHTML = data;
                })
                .catch(error => console.error("Error loading header:", error));
        });
    </script>
