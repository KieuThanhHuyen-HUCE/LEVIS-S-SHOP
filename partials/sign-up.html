<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang đăng nhập</title>
  <link rel="icon" type="image/png"
    href="//levi.co.th/cdn/shop/files/levis-logo-new-colour.svg?v=1701758773&amp;width=600" />
  <title>Levis's</title>
  <!-- LINK ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/fonts/themify-icons/themify-icons.css">
  <!-- ĐỂ LINK FILE CSS -->
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/components/header-footer.css">
  <link rel="stylesheet" href="/assets/css/components/user-sign-up.css">

</head>

<body>
  <div id="" class="modal">
    <div class="modal__overlay"></div>
    <div class="modal__body">
      <div class="auth-form">
        <div class="auth-form__container">
          <div class="auth-form__header">
            <div class="close-wrap">
              <i class="close-wrap__btn fa-solid fa-x"></i>
            </div>
            <img src="//levi.co.th/cdn/shop/files/levis-logo-new-colour.svg?v=1701758773&amp;width=600" alt=" Levi's"
              srcset="
                //levi.co.th/cdn/shop/files/levis-logo-new-colour.svg?v=1701758773&amp;width=80   80w,
                //levi.co.th/cdn/shop/files/levis-logo-new-colour.svg?v=1701758773&amp;width=120 120w,
                //levi.co.th/cdn/shop/files/levis-logo-new-colour.svg?v=1701758773&amp;width=160 160w
              " width="80" height="33.246753246753244" loading="eager" class="auth-form__header-img"
              sizes="(max-width: 160px) 50vw, 80px" />
            <!-- 80 32 -->
            <h3 class="auth-form__heading">Welcome Back!</h3>
            <p class="auth-form__header-text">
              Login for faster checkout and view all your benefits.
            </p>
          </div>
          <!-- phần form để nhập input -->
          <div class="auth-form__form">
            <!-- trang đăng nhập gồm sđt,mk -->
            <div class="auth-form__group">
              <input type="text" class="auth-form__input" placeholder="Your Name*" />
            </div>
            <div class="auth-form__group">
              <input type="text" class="auth-form__input" placeholder="Mobile Number / Email*" />
            </div>
            <div class="auth-form__group">
              <input type="password" class="auth-form__input" placeholder="Password*" />
            </div>
          </div>
          <!-- chọn giới tính -->
          <div class="gender-selection">
            <label class="gender-selection__item">
              <input type="radio" name="gender" value="male" class="gender-selection__circle" />
              <span>Male</span>
            </label>
            <label class="gender-selection__item">
              <input type="radio" name="gender" value="female" class="gender-selection__circle" />
              <span>Female</span>
            </label>
          </div>

          <!-- phần chính sách -->
          <div class="auth-form__aside">
            <p class="auth-form__policy-text">
              By registering, I agree to LS & Co.<a href="" class="auth-form__text-link">Terms & Conditions</a>
              and
              <a href="" class="auth-form__text-link">Terms of Use</a>. <br />I have
              read the LS&Co.<a href="" class="auth-form__text-link">Privacy Policy.</a>
            </p>
          </div>
          <!-- phần nút đăng kí return -->
          <div class="auth-form__controls">
            <button class="btn btn--primary btn-disabled">SIGN UP</button>
          </div>
        </div>
        <!-- liên kết mạng xã hội  -->
        <div class="auth-form__social">
          <a href="" class="auth-form__social--fb btn btn--with-icon">
            <i class="auth-form__social-icon fa-brands fa-facebook"></i>
            <span class="auth-form__social-text">Facebook</span>
          </a>
          <a href="" class="auth-form__social--gg btn btn--with-icon">
            <img class="auth-form__social-icon"
              src="https://img.icons8.com/?size=100&id=V5cGWnc9R4xj&format=png&color=000000" alt="Google logo"
              width="22" height="22" />
            <span class="auth-form__social-text">Google</span>
          </a>
        </div>
        <div class="auth-form__footer">
          <p class="auth-form__footer-text">
            Do you have an account?
            <a href="" class="auth-form__footer-link">Login</a>
          </p>
        </div>
      </div>
    </div>
</body>

</html>
